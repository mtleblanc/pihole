# Drop-in for transmission-daemon.service (Debian package runs it as
# debian-transmission).
[Unit]
# Never run without the kill switch.
Requires=homeserver-killswitch.service
After=homeserver-killswitch.service
# Bring the tunnel up alongside; traffic is blocked until it is.
Wants=openvpn-client@nordvpn.service
After=openvpn-client@nordvpn.service
# Stop when the drive is unplugged/unmounted.
BindsTo=${MOUNT_UNIT}
After=${MOUNT_UNIT}

[Service]
UMask=0002
