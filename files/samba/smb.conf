# Generated by homeserver install (steps/50-samba.sh) - edit in the repo.
[global]
   workgroup = WORKGROUP
   server role = standalone server
   map to guest = never
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

   # No printing
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # macOS clients: keep Finder metadata in xattrs instead of ._ files
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[${SMB_SHARE_NAME}]
   path = ${MOUNT_POINT}
   valid users = ${PI_USER}
   read only = no
   force group = ${MEDIA_GROUP}
   create mask = 0664
   directory mask = 2775
